# 毎朝5時(日本時間)にクラウド上で収集→原稿→音声→公開まで全自動実行する
# push時はデプロイのみ。手動実行(ワークフローを実行する)は音声テスト付きデプロイ
name: daily-radio

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 翌朝5:00 JST
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_tts:
        description: "音声合成の単体テストを行う"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: github.event_name != 'push'
        run: |
          npm ci
          python3 -m venv .venv-tts
          .venv-tts/bin/pip install edge-tts
      - name: TTS single test
        if: github.event_name == 'workflow_dispatch' && inputs.test_tts
        run: |
          echo "これは音声合成のテストです。クラウドから声が出せるか確認しています。" > /tmp/t.txt
          .venv-tts/bin/edge-tts --voice ja-JP-NanamiNeural --file /tmp/t.txt --write-media /tmp/t.mp3
          ls -la /tmp/t.mp3
      - name: Run daily pipeline
        if: github.event_name == 'schedule'
        run: node run-daily.mjs
      - name: Show logs on failure
        if: failure()
        run: cat logs/*.log 2>/dev/null || echo "no logs"
      - name: Commit generated content
        if: github.event_name == 'schedule'
        run: |
          git config user.name "unchi-ai-radio-bot"
          git config user.email "actions@github.com"
          git add out scripts site/data site/audio site/podcast.xml || true
          git commit -m "radio: $(date +%F)" || echo "no changes"
          git push
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
